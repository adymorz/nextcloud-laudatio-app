# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Lint, static analysis, tests and frontend build for the Nextcloud app, and
# the release for version tags vX.Y.Z: App Store, GitHub mirror and GitLab
# (see RELEASING.md).

workflow:
  rules:
    # Merge request pipelines, and branch pipelines only for branches without an open MR.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - lint
  - test
  - build
  - release
  - publish

default:
  interruptible: true
  tags: [linux]

variables:
  COMPOSER_CACHE_DIR: $CI_PROJECT_DIR/.cache/composer
  npm_config_cache: $CI_PROJECT_DIR/.cache/npm

.composer-setup: &composer-setup
  - apt-get update -qq && apt-get install -qq -y git unzip > /dev/null
  - curl -fsSL https://getcomposer.org/installer | php -- --quiet --install-dir=/usr/local/bin --filename=composer

.php:
  # Lowest PHP version supported by the app (Nextcloud 34)
  image: php:8.2-cli
  cache:
    key:
      prefix: composer
      files: [composer.lock]
    paths: [.cache/composer]
  before_script:
    - *composer-setup
    - composer install --no-interaction --no-progress

.node:
  image: node:24
  cache:
    key:
      prefix: npm
      files: [package-lock.json]
    paths: [.cache/npm]
  before_script:
    - npm ci --no-audit --no-fund

lint:info-xml:
  stage: lint
  image: alpine:3
  before_script:
    - apk add --no-cache curl libxml2-utils
  script:
    - curl -fsSL -o /tmp/info.xsd https://apps.nextcloud.com/schema/apps/info.xsd
    - xmllint --noout --schema /tmp/info.xsd appinfo/info.xml

# appinfo/info.xml, package.json and package-lock.json must carry the same version.
# A tag must be v<version> on a commit of the default branch, with release notes
# in CHANGELOG.md. The release jobs only run after this passed.
lint:version:
  stage: lint
  image: node:24
  variables:
    # Full history for the check that the tagged commit is on the default branch
    GIT_DEPTH: "0"
  script:
    - node scripts/version.mjs check "$CI_COMMIT_TAG"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        scripts/release-notes.sh > /dev/null
        git fetch --quiet origin "$CI_DEFAULT_BRANCH"
        git merge-base --is-ancestor "$CI_COMMIT_SHA" FETCH_HEAD || {
          echo "The tag $CI_COMMIT_TAG is not on $CI_DEFAULT_BRANCH. Merge first, then tag the merged commit."
          exit 1
        }
      fi

php:lint:
  extends: .php
  stage: lint
  script:
    - composer lint

php:cs:
  extends: .php
  stage: lint
  script:
    - composer cs:check

# Static analysis against the public API of every supported Nextcloud version.
# composer.json pins the lowest one; nextcloud/ocp for 35 needs PHP 8.3.
php:psalm:
  extends: .php
  image: php:8.3-cli
  stage: lint
  parallel:
    matrix:
      - OCP_VERSION: [dev-stable34, dev-stable35]
  script:
    - |
      if [ "$OCP_VERSION" != "dev-stable34" ]; then
        composer config platform.php 8.3
        composer require --dev "nextcloud/ocp:$OCP_VERSION" --with-all-dependencies --no-interaction --no-progress
      fi
    - composer psalm

php:openapi:
  extends: .php
  stage: lint
  script:
    - composer openapi
    - git diff --exit-code -- openapi.json || (echo "openapi.json is outdated, run 'composer openapi' and commit the result." && exit 1)

# Every file must carry its license information (headers or REUSE.toml)
lint:reuse:
  stage: lint
  image: python:3-alpine
  before_script:
    - apk add --no-cache git libmagic
    - pip install --quiet reuse
  script:
    - reuse lint

php:test:
  stage: test
  # Official Nextcloud image: release code in /usr/src/nextcloud plus all required PHP extensions.
  image:
    name: nextcloud:${NEXTCLOUD_VERSION}-apache
    entrypoint: [""]
  parallel:
    matrix:
      - NEXTCLOUD_VERSION: ["34", "35"]
  variables:
    NEXTCLOUD_ROOT: /usr/src/nextcloud
  cache:
    key:
      prefix: composer
      files: [composer.lock]
    paths: [.cache/composer]
  before_script:
    - *composer-setup
    - php $NEXTCLOUD_ROOT/occ maintenance:install --database=sqlite --admin-user=admin --admin-pass=admin
    - ln -s "$CI_PROJECT_DIR" "$NEXTCLOUD_ROOT/apps/laudatio"
    - php $NEXTCLOUD_ROOT/occ app:enable laudatio
    - composer install --no-interaction --no-progress
  script:
    - composer test

node:lint:
  extends: .node
  stage: lint
  script:
    - npm run lint

node:stylelint:
  extends: .node
  stage: lint
  script:
    - npm run stylelint

node:typecheck:
  extends: .node
  stage: lint
  script:
    - npm run typecheck

# The frontend types must match openapi.json
node:types:
  extends: .node
  stage: lint
  script:
    - npm run typescript:generate
    - git diff --exit-code -- src/types/openapi.ts || (echo "src/types/openapi.ts is outdated, run 'npm run typescript:generate' and commit the result." && exit 1)

# Every translatable string must be translated, and l10n/*.js must match l10n/*.json
lint:l10n:
  stage: lint
  image: node:24
  script:
    - npm run l10n
    - git diff --exit-code -- l10n/ || (echo "l10n/*.js is outdated, run 'npm run l10n' and commit the result." && exit 1)

node:build:
  extends: .node
  stage: build
  script:
    - npm run build
  artifacts:
    paths: [js/, css/]
    expire_in: 1 week

# Version tags (vX.Y.Z), after all other jobs passed, including lint:version.
# The signing key and the tokens are protected variables, available only for
# protected tags (v*).
.release:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-.+)?$/

# Build the archive with the frontend from node:build, sign the code with occ
# and the archive with openssl.
release:package:
  extends: .release
  stage: release
  image:
    name: nextcloud:34-apache
    entrypoint: [""]
  dependencies: [node:build]
  variables:
    NEXTCLOUD_ROOT: /usr/src/nextcloud
  before_script:
    - php $NEXTCLOUD_ROOT/occ maintenance:install --database=sqlite --admin-user=admin --admin-pass=admin
  script:
    - scripts/appstore-package.sh
    # The version for the archive link of release:gitlab
    - echo "APP_VERSION=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml)" > release.env
  artifacts:
    paths: [build/appstore/*.tar.gz, build/appstore/*.tar.gz.sig]
    reports:
      dotenv: release.env
    expire_in: 1 month

# Attach the archive to the GitHub release on the public mirror and register it in the App Store
release:publish:
  extends: .release
  stage: publish
  image: alpine:3
  interruptible: false
  dependencies: [release:package]
  before_script:
    - apk add --no-cache curl jq
  script:
    - scripts/appstore-publish.sh

# Create the release in GitLab with the notes from CHANGELOG.md, linking the
# archive on GitHub (the job artifacts expire). The release keyword needs glab,
# GitLab and GitLab Runner 18.0 or later; on older versions use the image
# registry.gitlab.com/gitlab-org/release-cli instead.
release:gitlab:
  extends: .release
  stage: publish
  image:
    name: registry.gitlab.com/gitlab-org/cli:latest
    entrypoint: [""]
  interruptible: false
  needs: [release:package, release:publish]
  script:
    - scripts/release-notes.sh > release-notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: release-notes.md
    assets:
      links:
        - name: laudatio-$APP_VERSION.tar.gz
          url: https://github.com/adymorz/nextcloud-laudatio-app/releases/download/$CI_COMMIT_TAG/laudatio-$APP_VERSION.tar.gz
          link_type: package
