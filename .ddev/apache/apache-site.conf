# Apache config for the Nextcloud dev environment.
#
# Based on DDEV's generated default for apache-fpm (DDEV v1.25.4). The only
# functional change is the document root: Nextcloud lives in the "nextcloud"
# volume at /var/www/nextcloud, while the app repository (/var/www/html) is
# symlinked into /var/www/nextcloud/apps-extra/. Nextcloud's own .htaccess
# handles rewrites, .well-known redirects and MIME types (AllowOverride All).
#
# This file is maintained manually (DDEV's generated-file marker was removed),
# so DDEV does not overwrite it.
# See https://docs.ddev.com/en/stable/users/extend/customization-extendibility/#custom-apache-configuration
<VirtualHost *:80>
    RewriteEngine On
    RewriteCond %{HTTP:X-Forwarded-Proto} =https
    RewriteCond    %{DOCUMENT_ROOT}%{REQUEST_FILENAME} -d
    RewriteRule    ^(.+[^/])$           https://%{HTTP_HOST}$1/ [redirect,last]

    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/nextcloud
    <Directory "/var/www/nextcloud/">
      Options FollowSymLinks
      AllowOverride All
      Allow from All
    </Directory>

    ErrorLog /dev/stdout
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Increase allowed field size for large cookies header.
    LimitRequestFieldSize 16380

    # Simple ddev technique to get a phpstatus
    Alias "/phpstatus" "/var/www/phpstatus.php"
    <Location "/phpstatus">
        SetHandler "proxy:unix:/var/run/php/php-fpm.sock|fcgi://localhost"
    </Location>
    Alias "/xhprof" "/var/xhprof/xhprof_html"
    <Directory "/var/xhprof">
        Options Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/master.crt
    SSLCertificateKeyFile /etc/ssl/certs/master.key

    RewriteEngine On
    RewriteCond %{HTTP:X-Forwarded-Proto} =https
    RewriteCond    %{DOCUMENT_ROOT}%{REQUEST_FILENAME} -d
    RewriteRule    ^(.+[^/])$           https://%{HTTP_HOST}$1/ [redirect,last]

    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/nextcloud
    <Directory "/var/www/nextcloud/">
      Options FollowSymLinks
      AllowOverride All
      Allow from All
    </Directory>

    ErrorLog /dev/stdout
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Increase allowed field size for large cookies header.
    LimitRequestFieldSize 16380

    # Simple ddev technique to get a phpstatus
    Alias "/phpstatus" "/var/www/phpstatus.php"
    <Location "/phpstatus">
        SetHandler "proxy:unix:/var/run/php/php-fpm.sock|fcgi://localhost"
    </Location>
    Alias "/xhprof" "/var/xhprof/xhprof_html"
    <Directory "/var/xhprof">
        Options Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
